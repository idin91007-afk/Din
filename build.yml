name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project and keep our code
        run: |
          mkdir /tmp/keep && cp -r lib pubspec.yaml /tmp/keep/
          flutter create --org com.yourname --project-name doc_scanner --platforms android .
          rm -rf lib pubspec.yaml && cp -r /tmp/keep/lib /tmp/keep/pubspec.yaml .
      - name: Patch Android config
        run: |
          python3 - <<'PY'
          import re,glob
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/>\n    <application',1)
          s=s.replace('</application>','<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>')
          s=re.sub(r'android:label="[^"]*"','android:label="স্ক্যানার"',s)
          open(p,'w').write(s)
          for g in glob.glob('android/app/build.gradle*'):
              t=open(g).read()
              t=t.replace('minSdk = flutter.minSdkVersion','minSdk = 23').replace('minSdkVersion flutter.minSdkVersion','minSdkVersion 23')
              open(g,'w').write(t)
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-files
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
